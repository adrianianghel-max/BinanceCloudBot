name: Collect Feedback

on:
  schedule:
    # Run every 4 hours to label signals that have passed their evaluation horizon
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Collect feedback (label pending signals)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import ccxt
          import config
          from outcome_tracker import collect_feedback_standalone

          exchange_params = {"enableRateLimit": True, "options": {"defaultType": "spot"}}
          if config.PROXY_URL:
              exchange_params["proxies"] = {"http": config.PROXY_URL, "https": config.PROXY_URL}

          exchange = ccxt.binance(exchange_params)
          collect_feedback_standalone(exchange)
          PY

      - name: 💾 Commit updated feedback files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_history.json feedback_log.json || true
          git diff --cached --quiet || git commit -m "chore: update feedback log"
          git push
