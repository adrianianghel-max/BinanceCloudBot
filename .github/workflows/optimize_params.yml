name: Optimize Parameters

on:
  schedule:
    # First day of each month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      trials:
        description: "Number of Optuna trials"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 Run Bayesian parameter optimization
        run: python param_optimizer.py --trials ${{ github.event.inputs.trials || '200' }}

      - name: 💾 Commit optimized config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.py || true
          git diff --cached --quiet || git commit -m "chore: auto-optimize config params via Optuna"
          git push
